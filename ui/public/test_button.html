<!DOCTYPE html>
<html>
<head>
    <title>Button Test</title>
    <style>
        body {
            background: #0e0e10;
            color: white;
            font-family: Arial;
            padding: 50px;
            text-align: center;
        }
        button {
            padding: 20px 40px;
            font-size: 1.5rem;
            background: #9147ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #772ce8;
        }
        #output {
            margin-top: 30px;
            padding: 20px;
            background: #18181b;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Button Click Test</h1>
    <p>If this button works, the issue is with Tauri commands</p>

    <button id="test-btn">Click Me!</button>

    <div id="output">Waiting for click...</div>

    <script>
        console.log('Test page loaded');
        console.log('Tauri available:', !!window.__TAURI__);

        const btn = document.getElementById('test-btn');
        const output = document.getElementById('output');

        btn.addEventListener('click', () => {
            console.log('Button clicked!');
            output.innerHTML = '✓ Button clicked at ' + new Date().toLocaleTimeString();

            // Try calling Tauri
            if (window.__TAURI__?.core?.invoke) {
                window.__TAURI__.core.invoke('check_auth_status')
                    .then(result => {
                        output.innerHTML += '<br>✓ Tauri command worked! Result: ' + result;
                    })
                    .catch(error => {
                        output.innerHTML += '<br>✗ Tauri command failed: ' + error;
                    });
            } else {
                output.innerHTML += '<br>⚠ Tauri not available';
            }
        });

        console.log('Event listener attached');
    </script>
</body>
</html>

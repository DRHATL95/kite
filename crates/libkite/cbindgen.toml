language = "C"
include_guard = "KITE_H"
cpp_compat = true
header = """/* libkite C ABI. Generated by cbindgen from crates/libkite/src/lib.rs; do not edit.
 * Regenerate: KITE_UPDATE_HEADER=1 cargo test -p libkite --test header
 *
 * Rules:
 * - A KiteHandle is a number, not a pointer. A stale or freed handle returns
 *   KITE_STATUS_INVALID_HANDLE; it cannot crash.
 * - Every command except kite_free returns at once. Results arrive later through the
 *   event callback, on a libkite thread: marshal them to your UI thread without
 *   blocking (post, do not send).
 * - kite_free waits for the stream to close and for libkite's threads to stop. After
 *   it returns the callback is never called again. It refuses to run inside the
 *   callback.
 * - KiteEvent.text is valid only during the callback: copy it. */"""

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[package]
name = "kite-core"
version = "0.0.0"
edition = "2024"
publish = false
description = "Kite engine: auth, token store, xHome, native WebRTC stack and clip remux. No UI."

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
chrono.workspace = true
tracing.workspace = true
getrandom.workspace = true
thiserror = "2.0"
# OS keychain for token storage
# pinned at 3: keyring 4 restructured its public API (Entry type moved, features removed)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
muxide = "0.2.5"
sha2 = "0.10"
base64 = "0.22"
str0m = { workspace = true, optional = true }
opus = { version = "0.4", optional = true }
ffmpeg-the-third = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
cpal = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Native Linux render stack. Optional + feature-gated so the default build stays
# lean and `cargo test` doesn't pull gtk on Windows.
gtk = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["json"] }

[features]
# Native Rust WebRTC media stack (Linux-first; opt-in so the default build stays
# lean and doesn't require ffmpeg/str0m toolchains).
native-webrtc = ["dep:str0m", "dep:opus", "dep:ffmpeg-the-third", "dep:bytes", "dep:cpal", "dep:gtk", "dep:glow", "dep:libloading"]

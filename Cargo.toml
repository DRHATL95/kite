[package]
name = "kite"
version = "0.6.0"
edition = "2024"

[dependencies]
# Tauri framework
tauri = { version = "2.11", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Xbox API
# pinned at 0.12: reqwest 0.13 removed RequestBuilder::form() used in auth.rs
reqwest = { version = "0.13", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Directory paths
dirs = "6.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
tracing-appender = "0.2"
regex = "1"

# OS keychain for token storage
# pinned at 3: keyring 4 restructured its public API (Entry type moved, features removed)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
muxide = "0.2.5"
str0m = { version = "0.20", optional = true }
opus = { version = "0.3", optional = true }
ffmpeg-the-third = { version = "5", optional = true }
bytes = { version = "1", optional = true }
cpal = { version = "0.15", optional = true }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["json"] }
# Phase-0 spike only (examples/rtc_spike.rs): error context + PNG encode.
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Native Linux render stack (Phase 4/6). Optional + feature-gated so the default
# Win/macOS build stays lean and `cargo test` doesn't pull gtk on Windows.
gtk = { version = "0.18", optional = true }
glow = { version = "0.13", optional = true }
libloading = { version = "0.7", optional = true }
tao = { version = "0.35", optional = true }
wry = { version = "0.55", optional = true }

# Phase-0 throwaway de-risk spike: str0m offerer → receive Xbox H.264 → decode
# one frame → PNG. Only built when the native stack is available.
[[example]]
name = "rtc_spike"
required-features = ["native-webrtc"]

# Phase-4 de-risk spike: prove flicker-free native-video-under-transparent-HUD
# compositing on Linux/WebKitGTK (GTK GLArea in a GtkOverlay). Linux-only.
[[example]]
name = "render_spike"
required-features = ["native-webrtc"]

# Phase-4 live render proof: spawn the real engine, render its decoded I420 frames
# in a gtk::GLArea (YUV→RGB via BT.709) under a transparent HUD. Linux-only.
[[example]]
name = "render_live"
required-features = ["native-webrtc"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[profile.release]
lto = false

[features]
# Native Rust WebRTC media stack (Linux-first; opt-in so the default build stays
# lean and doesn't require ffmpeg/str0m toolchains). See
# docs/superpowers/plans/2026-06-19-native-rust-webrtc.md.
native-webrtc = ["dep:str0m", "dep:opus", "dep:ffmpeg-the-third", "dep:bytes", "dep:cpal", "dep:gtk", "dep:glow", "dep:libloading", "dep:tao", "dep:wry"]

[package]
name = "xbox-remote"
version = "0.6.0"
edition = "2024"

[dependencies]
# Tauri framework
tauri = { version = "2.11", features = ["devtools"] }
tauri-plugin-shell = "2.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Xbox API
# pinned at 0.12: reqwest 0.13 removed RequestBuilder::form() used in auth.rs
reqwest = { version = "0.12", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Directory paths
dirs = "6.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
tracing-appender = "0.2"
regex = "1"

# OS keychain for token storage
# pinned at 3: keyring 4 restructured its public API (Entry type moved, features removed)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
muxide = "0.2.5"
str0m = { version = "0.20", optional = true }
opus = { version = "0.3", optional = true }
ffmpeg-the-third = { version = "5", optional = true }
bytes = { version = "1", optional = true }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
insta = "1"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[profile.release]
lto = false

[features]
# Native Rust WebRTC media stack (Linux-first; opt-in so the default build stays
# lean and doesn't require ffmpeg/str0m toolchains). See
# docs/superpowers/plans/2026-06-19-native-rust-webrtc.md.
native-webrtc = ["dep:str0m", "dep:opus", "dep:ffmpeg-the-third", "dep:bytes"]

[workspace]
members = [".", "crates/kite-core", "crates/libkite"]

# Versions shared by the app and kite-core live here so they cannot drift.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# pinned at 0.12: reqwest 0.13 removed RequestBuilder::form() used in auth.rs
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
getrandom = "0.4"
str0m = "0.23"
ffmpeg-the-third = "6"
cpal = "0.18"
gtk = "0.18"
glow = "0.18"
libloading = "0.9"

[package]
name = "kite"
version = "1.5.0"
edition = "2024"

[dependencies]
# Tauri framework
tauri = { version = "2.11", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"

# Engine: auth, token store, xHome, rtc, clip (crates/kite-core)
kite-core = { path = "crates/kite-core" }
serde.workspace = true
serde_json.workspace = true

# Async runtime
tokio.workspace = true

# HTTP client (release list)
reqwest.workspace = true

# Time handling
chrono.workspace = true

# Directory paths
dirs = "6.0"

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
tracing-appender = "0.2"
regex = "1"

# Used directly only by the gated examples (rtc_spike, render_spike).
str0m = { workspace = true, optional = true }
ffmpeg-the-third = { workspace = true, optional = true }
getrandom.workspace = true
# Decodes the embedded tray-icon PNGs (src/tray.rs); also used by the Phase-0
# rtc_spike example (error context + PNG encode) via anyhow below.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Phase-0 spike only (examples/rtc_spike.rs): error context.
anyhow = "1"

[target.'cfg(windows)'.dependencies]
# Plays the stream's audio from kite.exe itself (src/audio_out.rs) so Discord's
# window share, which captures only the shared window's process, hears it.
cpal.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Native Linux render stack (Phase 4/6). Optional + feature-gated so the default
# Win/macOS build stays lean and `cargo test` doesn't pull gtk on Windows.
gtk = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
tao = { version = "0.36", optional = true }
wry = { version = "0.56", optional = true }

# Phase-0 throwaway de-risk spike: str0m offerer → receive Xbox H.264 → decode
# one frame → PNG. Only built when the native stack is available.
[[example]]
name = "rtc_spike"
required-features = ["native-webrtc"]

# Phase-4 de-risk spike: prove flicker-free native-video-under-transparent-HUD
# compositing on Linux/WebKitGTK (GTK GLArea in a GtkOverlay). Linux-only.
[[example]]
name = "render_spike"
required-features = ["native-webrtc"]

# Phase-4 live render proof: spawn the real engine, render its decoded I420 frames
# in a gtk::GLArea (YUV→RGB via BT.709) under a transparent HUD. Linux-only.
[[example]]
name = "render_live"
required-features = ["native-webrtc"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[profile.release]
lto = false

[features]
# Native Rust WebRTC media stack (Linux-first; opt-in so the default build stays
# lean and doesn't require ffmpeg/str0m toolchains). See
# docs/superpowers/plans/2026-06-19-native-rust-webrtc.md.
native-webrtc = ["kite-core/native-webrtc", "dep:str0m", "dep:ffmpeg-the-third", "dep:gtk", "dep:glow", "dep:libloading", "dep:tao", "dep:wry"]

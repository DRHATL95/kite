[package]
name = "xbox-remote"
version = "0.1.0"
edition = "2021"

[dependencies]
# Tauri framework (optional)
tauri = { version = "2.0", optional = true }
tauri-plugin-shell = { version = "2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Network and discovery
mdns-sd = "0.11"
trust-dns-resolver = "0.23"

# HTTP client for Xbox API
reqwest = { version = "0.12", features = ["json"] }

# Video/Audio processing (optional)
gstreamer = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }
gstreamer-audio = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-rtp = { version = "0.23", optional = true }

# WebRTC for Xbox streaming
webrtc = "0.11"
webrtc-sdp = "0.3"

# OAuth2 for Xbox Live authentication
oauth2 = "4.4"
url = "2.5"
base64 = "0.22"
urlencoding = "2.1"

# Additional networking
bytes = "1.9"
tokio-util = { version = "0.7", features = ["codec"] }
rand = "0.8"

# HTTP server for local streaming
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Directory paths
dirs = "5.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = []
tauri = ["dep:tauri", "dep:tauri-plugin-shell", "tauri/devtools"]
gstreamer-support = ["dep:gstreamer", "dep:gstreamer-video", "dep:gstreamer-audio", "dep:gstreamer-app", "dep:gstreamer-rtp"]

[profile.release]
lto = false

version: 2

# PRs target the default branch (`main`). `target-branch: dev` was removed
# 2026-08-29: with it set, Dependabot does not use this configuration for
# security updates, so the `glib` ignore below never applied to them and the
# security-update job kept failing on every default-branch push — the exact
# failure that ignore was written to stop. Version and security updates now
# both read this file; sync dev from main to pick the bumps up.
updates:
  # Rust crates (Cargo.toml / Cargo.lock at the repo root)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # glib RUSTSEC-2024-0429 (VariantStrIter unsoundness) needs glib >= 0.20,
      # which is UNREACHABLE here: glib arrives via gtk 0.18 -> and `gtk` 0.18.2
      # is the last release of that crate (unmaintained, "use gtk4 instead").
      # tauri's own Linux backend (wry/tao) pulls the same gtk3 stack, so this
      # cannot be fixed by changing anything in this repo — it needs Tauri to
      # move to GTK4. Without this ignore, the security-update job fails on
      # every default-branch push with `security_update_not_possible`.
      # Re-check when Tauri ships a GTK4 backend, then delete this entry.
      - dependency-name: "glib"

  # Frontend deps (pnpm — package.json / pnpm-lock.yaml under ui/)
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

name: release

# Nightly: every push to dev    -> rolling "nightly" release on THIS repo
#          (version <target>-nightly.<run_number>).
# Stable:  pushing a v* tag      -> permanent vX.Y.Z archive + rolling "stable".
#
# Branch model: dev (nightly source) -> staging (soak/integration, no build) ->
#               main (release; tag vX.Y.Z on main to cut stable).
#
# Two jobs:
#   - linux-appimage: GitHub-hosted Ubuntu 24.04, builds the native-webrtc AppImage.
#   - release: the SELF-HOSTED runner, cross-compiles the Windows installer via
#     cargo-xwin, collects the AppImage, and publishes both.
# The publish job runs even when the AppImage job fails, and then ships Windows only.
# Releases are published to THIS repo's own GitHub Releases (public), so the
# in-app updater can read latest.json + binaries anonymously. Auth uses the
# built-in GITHUB_TOKEN (contents: write) — no cross-repo PAT.
on:
  push:
    branches: [dev]
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-appimage:
    # GitHub-hosted on purpose. The AppImage bundles the build image's GTK, and the
    # video underlay needs GTK >= 3.24.41: an AppImage built on Ubuntu 22.04 (GTK
    # 3.24.33, the self-hosted runner's OS) was black until a manual resize, and the
    # same source built on 24.04 was not (measured 2026-11-16). The cost is a glibc
    # 2.39 floor, so the AppImage does not run on Ubuntu 22.04 / Debian 12.
    name: linux AppImage (native-webrtc)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keeps the compiled cargo-tauri between runs (it lives in ~/.cargo/bin).
          cache-bin: true

      - name: Compute version + channel
        id: v
        run: bash scripts/ci/version.sh >> "$GITHUB_OUTPUT"

      - name: Install GTK + audio build deps
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            pkg-config libclang-dev libssl-dev libopus-dev libasound2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2t64 file

      - name: Build FFmpeg (LGPL, H.264 decode only)
        # Not the distro's: that one is GPL-configured and would be bundled into the
        # AppImage. See the script for the pinned version and checksum.
        run: sudo bash scripts/ci/build-ffmpeg.sh /opt/kite-ffmpeg

      - name: Build frontend
        working-directory: ui
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install the Tauri CLI
        run: command -v cargo-tauri >/dev/null 2>&1 || cargo install tauri-cli --locked --version "^2"

      - name: Tauri build (signed AppImage, native-webrtc)
        env:
          # pkg-config finds the LGPL FFmpeg for the build; the loader path lets the
          # bundler copy it into the AppImage.
          PKG_CONFIG_PATH: /opt/kite-ffmpeg/lib/pkgconfig
          LD_LIBRARY_PATH: /opt/kite-ffmpeg/lib
        run: |
          printf '{"version":"%s"}' "${{ steps.v.outputs.version }}" > ci-version.json
          cargo tauri build --bundles appimage --features native-webrtc --config ci-version.json
          # Fail here, not at publish, if a distro FFmpeg ever sneaks into the bundle.
          app="target/release/bundle/appimage/Kite_${{ steps.v.outputs.version }}_amd64.AppImage"
          test -f "$app" && test -f "$app.sig"
          want="$(basename "$(readlink -f /opt/kite-ffmpeg/lib/libavcodec.so)" | cut -d. -f1-3)"
          "$app" --appimage-extract >/dev/null
          found="$(find squashfs-root -name 'libavcodec.so*' -printf '%f\n' | sort -u | tr '\n' ' ')"
          echo "bundled libavcodec: ${found:-none} (want ${want})"
          case " $found" in *" ${want}"*) ;; *) echo "::error::AppImage does not bundle ${want}"; exit 1 ;; esac

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          if-no-files-found: error
          retention-days: 3
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig

  release:
    needs: linux-appimage
    # Publish Windows even when the AppImage job failed (BUILD_LINUX below turns
    # every Linux step off in that case); only a cancelled run skips publishing.
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64]
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      XWIN_ACCEPT_LICENSE: "1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      RELEASES_REPO: ${{ github.repository }}
      # 'true' only when the linux-appimage job produced an AppImage. It gates every
      # Linux step below, so a broken Linux build degrades to a Windows-only release
      # (latest.json simply has no linux entry) instead of blocking it.
      # History: Linux was off until 2026-11-16 because WebKitGTK renders WebRTC
      # video black; the gate was "the AppImage has to actually render video". It
      # did, with the native-webrtc engine, on Fedora 45 / KDE Wayland / NVIDIA.
      # Not covered by that test: X11 sessions and non-NVIDIA GPUs.
      BUILD_LINUX: ${{ needs.linux-appimage.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so the changelog step can diff against the
          # previous commit/tag. The default shallow clone (depth 1) would make
          # `git log <range>` and `git describe --tags` produce nothing.
          fetch-depth: 0

      # Build deps (GTK/WebKit, AppImage tooling, rust, node, gh, nsis, etc.) are
      # provisioned on the self-hosted runner by scripts/runner/setup-ct106.sh,
      # not installed per-build — the non-root `ghrunner` can't `sudo apt` anyway.
      - name: Compute version + channel
        id: v
        shell: bash
        run: bash scripts/ci/version.sh >> "$GITHUB_OUTPUT"

      - name: Build frontend
        # Run from ui/ so corepack reads the pinned pnpm from ui/package.json's
        # packageManager field (the repo root has no package.json, so running from
        # there would let corepack fall back to `latest` — which needs newer node).
        working-directory: ui
        run: |
          # pnpm's lockfile records all platform variants of the rolldown native
          # binding, so one committed pnpm-lock.yaml resolves on Linux here and on
          # Windows locally. --frozen-lockfile makes the lockfile authoritative.
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Tauri cross-build (signed NSIS for Windows x64)
        shell: bash
        run: |
          printf '{"version":"%s"}' "${{ steps.v.outputs.version }}" > ci-version.json
          cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc \
            --bundles nsis --config ci-version.json

      - name: Fetch the AppImage built by the linux-appimage job
        if: env.BUILD_LINUX == 'true'
        uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: target/release/bundle/appimage

      - name: Stage artifacts
        shell: bash
        run: |
          v='${{ steps.v.outputs.version }}'
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/bundle/nsis/Kite_${v}_x64-setup.exe"     "dist/kite_${v}_x64-setup.exe"
          cp "target/x86_64-pc-windows-msvc/release/bundle/nsis/Kite_${v}_x64-setup.exe.sig" "dist/kite_${v}_x64-setup.exe.sig"
          if [ "${BUILD_LINUX}" = "true" ]; then
            cp "target/release/bundle/appimage/Kite_${v}_amd64.AppImage"     "dist/kite_${v}_amd64.AppImage"
            cp "target/release/bundle/appimage/Kite_${v}_amd64.AppImage.sig" "dist/kite_${v}_amd64.AppImage.sig"
          fi

      - name: Build latest.json
        shell: bash
        run: |
          VERSION='${{ steps.v.outputs.version }}'
          POINTER='${{ steps.v.outputs.pointer_tag }}'
          # Asset URLs point at the rolling pointer release on this repo.
          base="https://github.com/${RELEASES_REPO}/releases/download/${POINTER}"
          export VERSION
          # Linux entry only when enabled; make-latest-json.sh omits it when the
          # LINUX_* vars are empty, producing a valid Windows-only manifest.
          LINUX_SIG_FILE=""; LINUX_URL=""
          if [ "${BUILD_LINUX}" = "true" ]; then
            LINUX_SIG_FILE="dist/kite_${VERSION}_amd64.AppImage.sig"
            LINUX_URL="${base}/kite_${VERSION}_amd64.AppImage"
          fi
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          NOTES='${{ steps.v.outputs.name }}' \
          WIN_SIG_FILE="dist/kite_${VERSION}_x64-setup.exe.sig" \
          WIN_URL="${base}/kite_${VERSION}_x64-setup.exe" \
          LINUX_SIG_FILE="$LINUX_SIG_FILE" \
          LINUX_URL="$LINUX_URL" \
          bash scripts/ci/make-latest-json.sh > dist/latest.json
          cat dist/latest.json

      - name: Build release notes (changelog)
        id: notes
        shell: bash
        env:
          # All github context passed via env (not inlined into the script) so
          # commit data can never be interpreted as shell. git log reads commit
          # subjects straight into the notes file — they are never evaluated.
          VERSION: ${{ steps.v.outputs.version }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p dist
          ZERO=0000000000000000000000000000000000000000
          if [ "$IS_TAG" = "true" ]; then
            # Stable: diff from the previous v* tag (omit range if this is the first).
            PREV="$(git describe --tags --abbrev=0 --match 'v*' "${SHA}^" 2>/dev/null || true)"
            RANGE="${PREV:+${PREV}..}${SHA}"
            HEADER="Stable release v${VERSION}${PREV:+ — changes since ${PREV}}"
          else
            # Nightly: diff exactly the commits this push introduced.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              RANGE="${BEFORE}..${SHA}"
            else
              RANGE="${SHA}~20..${SHA}"
            fi
            HEADER="Rolling nightly built from dev — ${VERSION}"
          fi
          {
            echo "$HEADER"
            echo
            echo "### What's changed"
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" 2>/dev/null \
              || echo "- see commit history"
            echo
          } > dist/notes.md
          [ -s dist/notes.md ] || echo "$HEADER" > dist/notes.md
          echo "---- release notes ----"; cat dist/notes.md

      - name: Publish release + assets (to this repo's GitHub Releases)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION='${{ steps.v.outputs.version }}'
          POINTER='${{ steps.v.outputs.pointer_tag }}'
          ARCHIVE='${{ steps.v.outputs.archive_tag }}'
          RELEASE_NAME='${{ steps.v.outputs.name }}'
          PRERELEASE='${{ steps.v.outputs.prerelease }}'
          source scripts/ci/github-release.sh

          assets=(
            "kite_${VERSION}_x64-setup.exe"
            "kite_${VERSION}_x64-setup.exe.sig"
          )
          if [ "${BUILD_LINUX}" = "true" ]; then
            assets+=(
              "kite_${VERSION}_amd64.AppImage"
              "kite_${VERSION}_amd64.AppImage.sig"
            )
          fi

          # Update the rolling pointer IN PLACE: ensure release -> upload binaries
          # (clobber) -> swap latest.json LAST -> prune stale assets. Never delete
          # the release, so its latest.json is never missing.
          ensure_release "$POINTER" "$RELEASE_NAME" "$PRERELEASE" dist/notes.md
          for f in "${assets[@]}"; do
            replace_asset "$POINTER" "dist/$f"
          done
          replace_asset "$POINTER" "dist/latest.json"
          prune_channel_assets "$POINTER" "$VERSION"

          # Stable also gets a permanent vX.Y.Z archive (binaries only).
          if [ -n "$ARCHIVE" ]; then
            create_archive_release "$ARCHIVE" "$RELEASE_NAME" dist/notes.md
            for f in "${assets[@]}"; do
              replace_asset "$ARCHIVE" "dist/$f"
            done
          fi

name: release

# Nightly: every push to dev    -> rolling "nightly" release on THIS repo
#          (version <target>-nightly.<run_number>).
# Stable:  pushing a v* tag      -> permanent vX.Y.Z archive + rolling "stable".
#
# Branch model: dev (nightly source) -> staging (soak/integration, no build) ->
#               main (release; tag vX.Y.Z on main to cut stable).
#
# Single job on the SELF-HOSTED Linux runner producing BOTH platforms:
#   - Windows installer CROSS-COMPILED via cargo-xwin.
#   - Linux AppImage built NATIVELY on the same runner.
# Releases are published to THIS repo's own GitHub Releases (public), so the
# in-app updater can read latest.json + binaries anonymously. Auth uses the
# built-in GITHUB_TOKEN (contents: write) — no cross-repo PAT.
on:
  push:
    branches: [dev]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      XWIN_ACCEPT_LICENSE: "1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      RELEASES_REPO: ${{ github.repository }}
      # Linux (AppImage) builds are DISABLED: WebKitGTK renders WebRTC video
      # black, so the AppImage isn't shippable. The fix is the native-webrtc
      # engine. CI now DOES compile that feature (the `rust-native-webrtc` job,
      # added 2026-08-16), so it is no longer unverified code — but compiling is
      # not rendering: nothing drives a live console in CI, so a green job says
      # nothing about whether the stream actually paints. v1.1.0 and v1.2.0 both
      # shipped Windows-only.
      # Deliberately NOT re-targeted at a version number — earlier comments here
      # promised 1.1 and then 1.2 and both slipped. The AppImage has to actually
      # render video before this flips; that is the only gate.
      # This gates every Linux step below — flip to 'true' to re-enable Linux
      # nightly + stable builds. Nothing is removed; the build/stage/manifest/
      # upload logic all remain.
      BUILD_LINUX: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so the changelog step can diff against the
          # previous commit/tag. The default shallow clone (depth 1) would make
          # `git log <range>` and `git describe --tags` produce nothing.
          fetch-depth: 0

      # Build deps (GTK/WebKit, AppImage tooling, rust, node, gh, nsis, etc.) are
      # provisioned on the self-hosted runner by scripts/runner/setup-ct106.sh,
      # not installed per-build — the non-root `ghrunner` can't `sudo apt` anyway.
      - name: Compute version + channel
        id: v
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"; VER="${VER#v}"
            { echo "version=$VER"; echo "pointer_tag=stable"; echo "archive_tag=v$VER";
              echo "name=v$VER"; echo "prerelease=false"; } >> "$GITHUB_OUTPUT"
          else
            TARGET="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            VER="${TARGET}-nightly.${{ github.run_number }}"
            { echo "version=$VER"; echo "pointer_tag=nightly"; echo "archive_tag=";
              echo "name=Nightly $VER"; echo "prerelease=true"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        # Run from ui/ so corepack reads the pinned pnpm from ui/package.json's
        # packageManager field (the repo root has no package.json, so running from
        # there would let corepack fall back to `latest` — which needs newer node).
        working-directory: ui
        run: |
          # pnpm's lockfile records all platform variants of the rolldown native
          # binding, so one committed pnpm-lock.yaml resolves on Linux here and on
          # Windows locally. --frozen-lockfile makes the lockfile authoritative.
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Tauri cross-build (signed NSIS for Windows x64)
        shell: bash
        run: |
          printf '{"version":"%s"}' "${{ steps.v.outputs.version }}" > ci-version.json
          cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc \
            --bundles nsis --config ci-version.json

      - name: Tauri build (signed AppImage for Linux x64)
        if: env.BUILD_LINUX == 'true'
        shell: bash
        run: |
          cargo tauri build --bundles appimage --config ci-version.json

      - name: Stage artifacts
        shell: bash
        run: |
          v='${{ steps.v.outputs.version }}'
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/bundle/nsis/Kite_${v}_x64-setup.exe"     "dist/kite_${v}_x64-setup.exe"
          cp "target/x86_64-pc-windows-msvc/release/bundle/nsis/Kite_${v}_x64-setup.exe.sig" "dist/kite_${v}_x64-setup.exe.sig"
          if [ "${BUILD_LINUX}" = "true" ]; then
            cp "target/release/bundle/appimage/Kite_${v}_amd64.AppImage"     "dist/kite_${v}_amd64.AppImage"
            cp "target/release/bundle/appimage/Kite_${v}_amd64.AppImage.sig" "dist/kite_${v}_amd64.AppImage.sig"
          fi

      - name: Build latest.json
        shell: bash
        run: |
          VERSION='${{ steps.v.outputs.version }}'
          POINTER='${{ steps.v.outputs.pointer_tag }}'
          # Asset URLs point at the rolling pointer release on this repo.
          base="https://github.com/${RELEASES_REPO}/releases/download/${POINTER}"
          export VERSION
          # Linux entry only when enabled; make-latest-json.sh omits it when the
          # LINUX_* vars are empty, producing a valid Windows-only manifest.
          LINUX_SIG_FILE=""; LINUX_URL=""
          if [ "${BUILD_LINUX}" = "true" ]; then
            LINUX_SIG_FILE="dist/kite_${VERSION}_amd64.AppImage.sig"
            LINUX_URL="${base}/kite_${VERSION}_amd64.AppImage"
          fi
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          NOTES='${{ steps.v.outputs.name }}' \
          WIN_SIG_FILE="dist/kite_${VERSION}_x64-setup.exe.sig" \
          WIN_URL="${base}/kite_${VERSION}_x64-setup.exe" \
          LINUX_SIG_FILE="$LINUX_SIG_FILE" \
          LINUX_URL="$LINUX_URL" \
          bash scripts/ci/make-latest-json.sh > dist/latest.json
          cat dist/latest.json

      - name: Build release notes (changelog)
        id: notes
        shell: bash
        env:
          # All github context passed via env (not inlined into the script) so
          # commit data can never be interpreted as shell. git log reads commit
          # subjects straight into the notes file — they are never evaluated.
          VERSION: ${{ steps.v.outputs.version }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p dist
          ZERO=0000000000000000000000000000000000000000
          if [ "$IS_TAG" = "true" ]; then
            # Stable: diff from the previous v* tag (omit range if this is the first).
            PREV="$(git describe --tags --abbrev=0 --match 'v*' "${SHA}^" 2>/dev/null || true)"
            RANGE="${PREV:+${PREV}..}${SHA}"
            HEADER="Stable release v${VERSION}${PREV:+ — changes since ${PREV}}"
          else
            # Nightly: diff exactly the commits this push introduced.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              RANGE="${BEFORE}..${SHA}"
            else
              RANGE="${SHA}~20..${SHA}"
            fi
            HEADER="Rolling nightly built from dev — ${VERSION}"
          fi
          {
            echo "$HEADER"
            echo
            echo "### What's changed"
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" 2>/dev/null \
              || echo "- see commit history"
            echo
          } > dist/notes.md
          [ -s dist/notes.md ] || echo "$HEADER" > dist/notes.md
          echo "---- release notes ----"; cat dist/notes.md

      - name: Publish release + assets (to this repo's GitHub Releases)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION='${{ steps.v.outputs.version }}'
          POINTER='${{ steps.v.outputs.pointer_tag }}'
          ARCHIVE='${{ steps.v.outputs.archive_tag }}'
          RELEASE_NAME='${{ steps.v.outputs.name }}'
          PRERELEASE='${{ steps.v.outputs.prerelease }}'
          source scripts/ci/github-release.sh

          assets=(
            "kite_${VERSION}_x64-setup.exe"
            "kite_${VERSION}_x64-setup.exe.sig"
          )
          if [ "${BUILD_LINUX}" = "true" ]; then
            assets+=(
              "kite_${VERSION}_amd64.AppImage"
              "kite_${VERSION}_amd64.AppImage.sig"
            )
          fi

          # Update the rolling pointer IN PLACE: ensure release -> upload binaries
          # (clobber) -> swap latest.json LAST -> prune stale assets. Never delete
          # the release, so its latest.json is never missing.
          ensure_release "$POINTER" "$RELEASE_NAME" "$PRERELEASE" dist/notes.md
          for f in "${assets[@]}"; do
            replace_asset "$POINTER" "dist/$f"
          done
          replace_asset "$POINTER" "dist/latest.json"
          prune_channel_assets "$POINTER" "$VERSION"

          # Stable also gets a permanent vX.Y.Z archive (binaries only).
          if [ -n "$ARCHIVE" ]; then
            create_archive_release "$ARCHIVE" "$RELEASE_NAME" dist/notes.md
            for f in "${assets[@]}"; do
              replace_asset "$ARCHIVE" "dist/$f"
            done
          fi

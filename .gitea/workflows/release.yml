name: release

# Nightly: every push to master -> rolling "nightly" release (version 0.1.<run_number>).
# Stable:  pushing a v* tag    -> permanent vX.Y.Z release.
#
# Single job on the Linux runner: the Windows installer is CROSS-COMPILED via
# cargo-xwin (validated 2026-06-10: exe + updater .sig build and run fine on
# real Windows), then the native Linux AppImage is built on the same runner.
# Runner prerequisites (baked into CT 106): clang/lld/llvm, nsis, rust target
# x86_64-pc-windows-msvc, cargo-xwin, warm xwin SDK cache, Tauri Linux deps,
# AppImage tooling, jq, curl, Node, and Rust.
#
# NOTE: build+publish are ONE job on purpose — actions/upload-artifact@v4
# hard-refuses non-github.com servers ("GHES not supported"), so cross-job
# artifact handoff is avoided entirely. If a second build job is ever added,
# use the Gitea-mirrored artifact actions (gitea.com/actions/*) instead.
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: linux
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      XWIN_ACCEPT_LICENSE: "1"
      GITEA: https://gitea.howlab.co
      REPO: dave/xbox-remote
      TOKEN: ${{ secrets.GITEA_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version + channel
        id: v
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"; VER="${VER#v}"
            { echo "version=$VER"; echo "tag=v$VER"; echo "name=v$VER";
              echo "prerelease=false"; echo "channel=stable"; } >> "$GITHUB_OUTPUT"
          else
            VER="0.1.${{ github.run_number }}"
            { echo "version=$VER"; echo "tag=nightly"; echo "name=Nightly $VER";
              echo "prerelease=true"; echo "channel=nightly"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      # Inject the CI version via Tauri's --config merge-patch (RFC 7396);
      # the committed version stays 0.1.0 and the tree stays clean.
      - name: Tauri cross-build (signed NSIS for Windows x64)
        shell: bash
        run: |
          printf '{"version":"%s"}' "${{ steps.v.outputs.version }}" > ci-version.json
          cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc \
            --bundles nsis --config ci-version.json

      - name: Tauri build (signed AppImage for Linux x64)
        shell: bash
        run: |
          cargo tauri build --bundles appimage --config ci-version.json

      # Space-free asset names so release URLs need no %20 escaping.
      # The .sig signs file BYTES, so renaming does not invalidate it.
      - name: Stage artifacts
        shell: bash
        run: |
          v='${{ steps.v.outputs.version }}'
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/bundle/nsis/Xbox Remote_${v}_x64-setup.exe"     "dist/xbox-remote_${v}_x64-setup.exe"
          cp "target/x86_64-pc-windows-msvc/release/bundle/nsis/Xbox Remote_${v}_x64-setup.exe.sig" "dist/xbox-remote_${v}_x64-setup.exe.sig"
          cp target/release/bundle/appimage/*.AppImage     "dist/xbox-remote_${v}_amd64.AppImage"
          cp target/release/bundle/appimage/*.AppImage.sig "dist/xbox-remote_${v}_amd64.AppImage.sig"

      - name: Build latest.json
        shell: bash
        run: |
          VERSION='${{ steps.v.outputs.version }}'
          TAG='${{ steps.v.outputs.tag }}'
          base="${GITEA}/${REPO}/releases/download/${TAG}"
          # make-latest-json.sh runs as a child process — VERSION must be in its ENV
          export VERSION
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          NOTES='${{ steps.v.outputs.name }}' \
          WIN_SIG_FILE="dist/xbox-remote_${VERSION}_x64-setup.exe.sig" \
          WIN_URL="${base}/xbox-remote_${VERSION}_x64-setup.exe" \
          LIN_SIG_FILE="dist/xbox-remote_${VERSION}_amd64.AppImage.sig" \
          LIN_URL="${base}/xbox-remote_${VERSION}_amd64.AppImage" \
          bash scripts/ci/make-latest-json.sh > dist/latest.json
          cat dist/latest.json

      - name: Create release + upload assets
        shell: bash
        run: |
          VERSION='${{ steps.v.outputs.version }}'
          TAG='${{ steps.v.outputs.tag }}'
          RELEASE_NAME='${{ steps.v.outputs.name }}'
          CHANNEL='${{ steps.v.outputs.channel }}'
          source scripts/ci/gitea-release.sh
          if [ "$CHANNEL" = nightly ]; then
            ID="$(roll_nightly "$TAG" "$RELEASE_NAME" true "$GITHUB_SHA")"
          else
            ID="$(create_release "$TAG" "$RELEASE_NAME" false "$GITHUB_SHA")"
          fi
          echo "release id: $ID"
          for f in \
            "xbox-remote_${VERSION}_x64-setup.exe" \
            "xbox-remote_${VERSION}_x64-setup.exe.sig" \
            "xbox-remote_${VERSION}_amd64.AppImage" \
            "xbox-remote_${VERSION}_amd64.AppImage.sig" \
            "latest.json"; do
            upload_asset "$ID" "$f" "dist/$f"
          done

name: release

# Nightly: every push to master -> rolling "nightly" release
#          (version <target>-nightly.<run_number>; <target> read from Cargo.toml).
# Stable:  pushing a v* tag    -> permanent vX.Y.Z archive + rolling "stable" pointer.
#
# Single job on the Linux runner producing BOTH platforms:
#   - Windows installer CROSS-COMPILED via cargo-xwin (validated 2026-06-10:
#     exe + updater .sig build and run fine on real Windows).
#   - Linux AppImage built NATIVELY on the same runner (host target).
# Both share the one ui/dist build and the one injected version; both get a
# signed updater artifact and an entry in latest.json.
#
# Runner prerequisites (CT 106): clang/lld/llvm, nsis, rust target
# x86_64-pc-windows-msvc, cargo-xwin, warm xwin SDK cache. The Linux build also
# needs the GTK/WebKit dev libs + AppImage tooling; the workflow installs them
# defensively below, but baking them into CT 106 is faster — see the
# "Install Linux build dependencies" step.
#
# NOTE: build+publish are ONE job on purpose — actions/upload-artifact@v4
# hard-refuses non-github.com servers ("GHES not supported"), so cross-job
# artifact handoff is avoided entirely. If a second build job is ever added,
# use the Gitea-mirrored artifact actions (gitea.com/actions/*) instead.
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: linux
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      XWIN_ACCEPT_LICENSE: "1"
      # Run the AppImage tooling without FUSE (CI containers usually lack it).
      APPIMAGE_EXTRACT_AND_RUN: "1"
      GITEA: https://gitea.howlab.co
      REPO: dave/xbox-remote
      TOKEN: ${{ secrets.GITEA_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # GTK/WebKit dev libs + AppImage tooling for the NATIVE Linux bundle.
      # Ideally baked into CT 106 (drop this step then); kept here so a fresh
      # runner still works. apt is idempotent, so re-running is cheap.
      # NOTE: use libayatana-appindicator3-dev, NOT legacy libappindicator3-dev —
      # jammy's libwebkit2gtk-4.1 pulls in libayatana-appindicator3-1, which
      # Conflicts: libappindicator3-1. If baking these deps into CT 106, install
      # the ayatana variant there too, or this apt conflict comes right back.
      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file

      - name: Compute version + channel
        id: v
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"; VER="${VER#v}"
            { echo "version=$VER"; echo "pointer_tag=stable"; echo "archive_tag=v$VER";
              echo "name=v$VER"; echo "prerelease=false"; } >> "$GITHUB_OUTPUT"
          else
            # Nightly = prerelease of the committed in-dev target, so it sorts below
            # the eventual stable (0.3.0-nightly.41 < 0.3.0-nightly.42 < 0.3.0).
            TARGET="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            VER="${TARGET}-nightly.${{ github.run_number }}"
            { echo "version=$VER"; echo "pointer_tag=nightly"; echo "archive_tag=";
              echo "name=Nightly $VER"; echo "prerelease=true"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      # Inject the CI version via Tauri's --config merge-patch (RFC 7396);
      # the committed version (Cargo.toml in-dev target) supplies the base and the tree stays clean.
      - name: Tauri cross-build (signed NSIS for Windows x64)
        shell: bash
        run: |
          printf '{"version":"%s"}' "${{ steps.v.outputs.version }}" > ci-version.json
          cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc \
            --bundles nsis --config ci-version.json

      # Native Linux build (host target x86_64-unknown-linux-gnu). Reuses the
      # ci-version.json written above and the already-built ui/dist.
      - name: Tauri build (signed AppImage for Linux x64)
        shell: bash
        run: |
          cargo tauri build --bundles appimage --config ci-version.json

      # Space-free asset names so release URLs need no %20 escaping.
      # The .sig signs file BYTES, so renaming does not invalidate it.
      - name: Stage artifacts
        shell: bash
        run: |
          v='${{ steps.v.outputs.version }}'
          mkdir -p dist
          # Windows (cross-compiled NSIS)
          cp "target/x86_64-pc-windows-msvc/release/bundle/nsis/Xbox Remote_${v}_x64-setup.exe"     "dist/xbox-remote_${v}_x64-setup.exe"
          cp "target/x86_64-pc-windows-msvc/release/bundle/nsis/Xbox Remote_${v}_x64-setup.exe.sig" "dist/xbox-remote_${v}_x64-setup.exe.sig"
          # Linux (native AppImage). Tauri names the AppImage with arch token "amd64".
          cp "target/release/bundle/appimage/Xbox Remote_${v}_amd64.AppImage"     "dist/xbox-remote_${v}_amd64.AppImage"
          cp "target/release/bundle/appimage/Xbox Remote_${v}_amd64.AppImage.sig" "dist/xbox-remote_${v}_amd64.AppImage.sig"

      - name: Build latest.json
        shell: bash
        run: |
          VERSION='${{ steps.v.outputs.version }}'
          POINTER='${{ steps.v.outputs.pointer_tag }}'
          # latest.json asset URLs point at the rolling pointer release so they keep
          # working as it rolls (nightly or stable).
          base="${GITEA}/${REPO}/releases/download/${POINTER}"
          export VERSION
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          NOTES='${{ steps.v.outputs.name }}' \
          WIN_SIG_FILE="dist/xbox-remote_${VERSION}_x64-setup.exe.sig" \
          WIN_URL="${base}/xbox-remote_${VERSION}_x64-setup.exe" \
          LINUX_SIG_FILE="dist/xbox-remote_${VERSION}_amd64.AppImage.sig" \
          LINUX_URL="${base}/xbox-remote_${VERSION}_amd64.AppImage" \
          bash scripts/ci/make-latest-json.sh > dist/latest.json
          cat dist/latest.json

      - name: Create release + upload assets
        shell: bash
        run: |
          VERSION='${{ steps.v.outputs.version }}'
          POINTER='${{ steps.v.outputs.pointer_tag }}'
          ARCHIVE='${{ steps.v.outputs.archive_tag }}'
          RELEASE_NAME='${{ steps.v.outputs.name }}'
          PRERELEASE='${{ steps.v.outputs.prerelease }}'
          source scripts/ci/gitea-release.sh

          assets=(
            "xbox-remote_${VERSION}_x64-setup.exe"
            "xbox-remote_${VERSION}_x64-setup.exe.sig"
            "xbox-remote_${VERSION}_amd64.AppImage"
            "xbox-remote_${VERSION}_amd64.AppImage.sig"
          )

          # Update the channel pointer (nightly or stable) IN PLACE — never delete it,
          # so its latest.json is never missing. Upload binaries first, swap latest.json
          # LAST (so the manifest always points at assets that already exist), then prune
          # stale assets from previous versions.
          PID="$(ensure_release "$POINTER" "$RELEASE_NAME" "$PRERELEASE" "$GITHUB_SHA")"
          echo "pointer release id: $PID"
          for f in "${assets[@]}"; do
            replace_asset "$PID" "$f" "dist/$f"
          done
          replace_asset "$PID" "latest.json" "dist/latest.json"
          prune_channel_assets "$PID" "$VERSION"

          # Stable also gets a permanent vX.Y.Z archive (binaries only; the pointer
          # holds the updater manifest).
          if [ -n "$ARCHIVE" ]; then
            # Fails intentionally if vX.Y.Z already exists — stable tags are cut once.
            AID="$(create_release "$ARCHIVE" "$RELEASE_NAME" false "$GITHUB_SHA")"
            echo "archive release id: $AID"
            for f in "${assets[@]}"; do
              upload_asset "$AID" "$f" "dist/$f"
            done
          fi
